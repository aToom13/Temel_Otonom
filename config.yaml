# Temel Otonom Sistem Yapilandirmasi

kamera:
  genislik: 640
  yukseklik: 480
  fps: 30

# Serit Tespit Yontemi: 'klasik' (Canny+Hough+LinearFit), 'kus_bakisi' (IPM+SlidingWindow) veya 'hibrit'
serit_modu: 'hibrit'

# Klasik Hough Serit Ayarlari
klasik_serit:
  canny_alt: 50
  canny_ust: 150
  hough_esik: 40
  min_cizgi_boyu: 30
  max_cizgi_boslugu: 35

# Kus bakisi perspektif donusum koordinatlari (ROI)
perspektif:
  sol_ust: [256, 278]
  sol_alt: [76, 460]
  sag_ust: [384, 278]
  sag_alt: [564, 460]

# PID Yonlendirme Parametreleri
pid:
  kp: 0.12
  ki: 0.01
  kd: 0.18
  max_direksiyon_acisi: 35.0

# Arac Hiz Parametreleri (0-255 arasi PWM degeri)
hiz:
  taban_hiz: 110
  viraj_hizi: 85
  min_hiz: 70

# YOLOv8 Nesne, Arac ve Tabela Tespiti
yolo:
  model_yolu: "modeller/best.pt"
  guven_esigi: 0.45
  aktif: true
  odak_uzakligi: 950.0

# YOLOv8 Tabanli Serit Segmentasyonu (Gunes-Golge Dayanimi)
yolo_serit:
  model_yolu: "modeller/yolov8_serit_seg.pt"
  guven_esigi: 0.30
  aktif: true

# Donanim Seri Port Ayarlari (Arduino)
seri_port:
  port: "/dev/ttyUSB0"
  baudrate: 115200
  aktif: false
  protokol: "ascii_ha"  # 'ascii_ha' (H<hiz>A<aci>) veya 'kat4_rv' (r015v110)
